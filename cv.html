<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV | Eslam Sayed</title>
  <link rel="icon" type="image/png" href="es-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #111;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px 20px 60px;
    }

    h1 {
      text-align: center;
      color: #FFD700;
      margin-bottom: 20px;
      font-size: 2.2rem;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background-color: #FFD700;
      color: #000;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: #e6c200;
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(241, 196, 15, 0.4);
    }

    .pdf-container {
      width: 100%;
      height: 78vh;
      border: none;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .download-section {
      text-align: center;
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px; /* مسافة بين النص والزرار */
    }

    .download-text {
      font-size: 1rem;
      font-weight: bold;
      color: #FFD700;
    }

    .download-btn img {
      width: 40px;
      height: 40px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      vertical-align: middle;
    }

    .download-btn img:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(241, 196, 15, 0.4);
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      .pdf-container { height: 65vh; }
      .download-section { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <a class="back-button" href="index.html">← Home</a>
  <div class="container">
    <h1>My CV</h1>

    <!-- Embedded Google Drive Viewer -->
    <iframe
      loading="lazy"
      src="https://drive.google.com/file/d/1y-JK5voDev9V8_HSdngVQn69t54F29PL/preview"
      class="pdf-container"
      allow="autoplay">
    </iframe>

    <div class="download-section">
      <span class="download-text">You can download the CV from here:</span>
      <a href="https://drive.google.com/uc?export=download&id=1y-JK5voDev9V8_HSdngVQn69t54F29PL" 
         class="download-btn" 
         download 
         rel="noopener">
        <img src="cv-download.png" alt="Download CV" style="margin-left:30px; vertical-align:middle; cursor:pointer;" />
      </a>
    </div>
  </div>
</body>
</html>
